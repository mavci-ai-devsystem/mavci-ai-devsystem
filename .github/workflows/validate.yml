name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'

      # Generated agent files must match a fresh render. This is what stops a
      # hand-edit to agents/*.md from surviving, which is the whole point of the
      # generator (ARCHITECTURE section 5).
      - name: Agents are up to date
        run: node plugins/mavci-core/scripts/build-agents.mjs --check

      - name: Schemas parse and use only supported keywords
        run: node scripts/ci/check-schemas.mjs

      - name: Redaction self-test
        run: node plugins/mavci-core/scripts/redact.mjs --selftest

      # Every rule must fail its bad/ fixture and pass its good/ fixture.
      # A rule with no fixture pair fails this job: an unfixtured rule can
      # regress silently, and regressing silently is how enforcement decays.
      - name: Rule fixtures
        run: node scripts/ci/check-fixtures.mjs

      - name: Risk guard behaves
        run: node scripts/ci/check-risk-guard.mjs

      # Every case here was once a SILENT bug. Fail-closed paths, the fast path,
      # the loop ceiling and the timeout sentinel are all unobservable in normal
      # use, so they are only ever as good as this job.
      - name: Gate fails closed
        run: node scripts/ci/check-gate.mjs

      # `/mavci-core:retro` was named in seven places across eleven releases and
      # never existed. The gate trapped an agent on a checker crash and sent it
      # to a command that was not there - both halves of the operator channel
      # absent at once. Nothing could see it, because a command reference is a
      # prose string: no code builds one and no loader resolves one.
      - name: Every command reference resolves to a real skill
        run: node scripts/ci/check-command-refs.mjs

      # One 583-character evidence string took the whole checker offline for a
      # project. The cap lived only in verdict.schema.json, so it fired at
      # writeControl - after the run, inside the gate - and `verify.mjs --record`,
      # the only mode the gate uses, threw on every turn. Plain `verify.mjs` was
      # healthy throughout, which is why testing that half proved nothing.
      #
      # Same job asserts the other authoring-time property of the rule set: a
      # remedy needing authority the agent does not have must say so. "Have the
      # text reviewed, then delete the REVIEW REQUIRED marker" told an agent to
      # do one thing it cannot and one thing it must not.
      - name: Rule strings fit their caps, and remedies name who can act
        run: node scripts/ci/check-evidence-caps.mjs

      # The escalation channel's own first run found two defects in it. The queue
      # is a DIRECTORY and both readers - retro and doctor - tested one fixed path
      # inside it, so the file that was actually queued was invisible and --clear
      # would have orphaned it. And record() wrote its heading with U+002D while
      # every hand-written heading used U+2014, so the parser counted machine
      # findings, missed human ones, and would have written a second "# Finding 1".
      - name: The queue is read as a directory, and the writer and parser agree
        run: node scripts/ci/check-retro.mjs

      - name: Plugin structure
        run: node scripts/ci/check-plugin.mjs

      # doctor must FAIL when Claude Code did not register the plugin's hooks.
      # v0.1.2 registered zero hooks and doctor reported "hook self-test passed":
      # it was testing the guard scripts, not whether anything calls them.
      - name: Doctor proves hook registration
        run: node scripts/ci/check-doctor.mjs

      # User scope means this plugin resolves in EVERY repository on the machine,
      # so all eight hooks run in repos that have nothing to do with Mavci. All
      # eight must be silent there and leave nothing behind. The SessionStart
      # preflight was not: it reported "not a Mavci project", and the toolchain
      # warnings, into every unrelated repo.
      - name: Hooks are silent outside a Mavci project
        run: node scripts/ci/check-hooks-quiet.mjs

      # A __TOKEN__ reaching a generated project is a build failure: __PROJECT_ID__
      # in package.json makes `npm ci` fail, so a fresh scaffold is not green.
      - name: No template placeholder survives a render
        run: node scripts/ci/check-placeholders.mjs

      # A skill that says $CLAUDE_PLUGIN_ROOT instead of ${CLAUDE_PLUGIN_ROOT} is not
      # substituted and not exported: it expands to an empty string, and on Windows
      # Git Bash then reads the remaining /scripts/x.mjs as an absolute POSIX path.
      # That one character broke every command in the system for seven releases and
      # no job here could see it - check-plugin.mjs reads frontmatter, never the body.
      - name: Skill and agent content uses the substituted placeholder form
        run: node scripts/ci/check-skill-placeholders.mjs

      # The static check above proves the FORM is right. This one proves the
      # commands RUN: it extracts each skill's inline blocks, substitutes the
      # placeholders the way the loader does, and executes them in a real
      # scaffolded project. Nothing else in CI invokes anything - plugin validate
      # reads manifests, check-plugin reads frontmatter, every other check calls
      # the scripts directly with node, and /context only counts what resolved.
      # All of those pass on a plugin whose every command is broken.
      - name: Every command dynamic context substitutes and runs
        run: node scripts/ci/check-command-invocation.mjs

      # Everything above runs from the repo, where <plugin>/../../templates
      # happens to resolve. An INSTALLED plugin is only the plugins/mavci-core
      # subtree, so 0.1.3-0.1.5 exited 2 on every real install while CI stayed
      # green. This renders from an isolated copy of that subtree alone.
      - name: Plugin is self-contained when installed
        run: node scripts/ci/check-packaging.mjs

  # Claude Code's own validator is the AUTHORITY on plugin and hook schema.
  #
  # v0.1.2 shipped `"command": ["node", "..."]` in hooks.json. Claude Code's
  # plugin loader rejected all eight entries with `expected string, received
  # array` and installed the plugin with ZERO hooks and no visible error: no
  # risk guard, no standards gate, no phase gate. Every local probe missed it,
  # because `--plugin-dir` and doctor's self-test never go through the loader's
  # schema validation. `claude plugin validate --strict` reproduces those eight
  # errors exactly, so from 0.1.3 it runs before anything ships.
  #
  # Deliberately unpinned: the point is to track the schema real users' Claude
  # Code enforces, so this job breaks when upstream changes it. It needs no
  # authentication. If the CLI is missing the step fails, which is correct -
  # "could not check" is never a pass (invariant 5).
  #
  # This is a CI tool, not a system dependency. selftest.yml still proves the
  # whole toolchain runs with Claude Code absent (ARCHITECTURE section 11).
  plugin-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Claude Code validates the plugin
        run: claude plugin validate ./plugins/mavci-core --strict

      - name: Claude Code validates the marketplace
        run: claude plugin validate . --strict

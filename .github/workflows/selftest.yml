# THE ESCAPE-HATCH PROOF (ARCHITECTURE section 11).
#
# Everything this system produces must remain usable without the system.
# This job runs the checker, the state validator and the redactor in a container
# where Claude Code is NOT installed. If any of them needs Claude Code, or an npm
# dependency, the job fails.
#
# The escape hatch is a passing test, not a promise.

name: selftest

on:
  push:
  pull_request:

jobs:
  no-claude-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'

      - name: Prove Claude Code is absent
        run: |
          if command -v claude >/dev/null 2>&1; then
            echo "::error::claude is on PATH; this job must prove the tooling runs without it"
            exit 1
          fi
          echo "claude is not installed - good"

      - name: Prove there are no npm dependencies
        run: |
          if [ -f package.json ] || [ -f package-lock.json ] || [ -d node_modules ]; then
            echo "::error::the system repo must have no npm dependency surface"
            exit 1
          fi
          echo "no package.json, no lockfile, no node_modules - good"

      - name: Scaffold a project and verify it, using nothing but node
        run: node scripts/ci/check-escape-hatch.mjs

      # The plan transition was two writes to state.json with an interruptible
      # middle. On 2026-09-02 an external classifier landed in it: --set-phase
      # plan committed, --new-task was denied, and gate4c sat frozen with nothing
      # to plan against. The assertion is on the state after a FAILED SECOND HALF
      # and on which key each version reader reads - never on the two halves
      # separately, which are green either way.
      - name: The plan transition is one write, and each version field has one reader
        run: node scripts/ci/check-state-transition.mjs

      # A verdict names the task attempt that produced it, and the attempt counter
      # that names it can actually move. Both were modelled and neither had a
      # writer: every verdict on the first real project is adhoc-<epoch>, every
      # control task verdicts[] is empty, and incrementAttempt and blockTask were
      # exported and called from nowhere. The discriminating assertion is A4 - a
      # run asked to attribute and unable to must REFUSE, because a fallback to
      # adhoc is indistinguishable downstream from a successful attribution.
      - name: A verdict names its task attempt, and the retry ceiling is reachable
        run: node scripts/ci/check-provenance.mjs

      # The chain had no edge from a FAILED verify back to the builder, and could
      # not have had one: the builder refuses unless the phase is build, and a
      # failed verify leaves it at verify. The retry ceiling was being tracked for
      # a loop with no entrance. R-REWORK is that edge; R-CEILING is what ends it;
      # R-ADHOC is finding 25 one directory over - a per-turn gate verdict must
      # decide nothing.
      - name: The router has every edge, including the rework loop
        run: node scripts/ci/check-route.mjs

      # Prediction 2a of the guardian design: guardian has two properties and only
      # one of them needs a model. The worklist, the enumeration and the coverage
      # arithmetic are node scripts with no model in the loop, so they belong HERE -
      # in the workflow that runs with Claude Code absent and zero dependencies.
      # Whether guardian ANSWERS correctly is an operator-run corpus and cannot live
      # in CI; that is stated as the residual rather than papered over.
      - name: Guardian's deterministic half runs without Claude Code
        run: node scripts/ci/check-service-role-sites.mjs

      # Guardian's coverage subtraction, its floor, and both negative controls.
      # sites_total === 0 is not_checked BEFORE any subtraction: with an empty
      # worklist the arithmetic reports perfect coverage of nothing, and a pass there
      # would be the most expensive lie this system can tell.
      # FIRST, because it decides whether any result below means anything.
      # check-guardian.mjs had its only failure gate at line 176 of 429: the whole
      # SubagentStop writer section printed FAIL into an array nothing read, and
      # the script exited 0. 31 assertions, green since 0.1.15, found by mutation
      # rather than by reading. This asserts the SHAPE - every assertion ahead of
      # a gate that can fail - across every check in the directory.
      - name: Every assertion in every check can fail the build
        run: node scripts/ci/check-ci-gates.mjs

      # Finding 20: the shared agent contract is rendered into five agents whose
      # grants differ, and ordered guardian to invoke a skill it holds no tool for
      # and to read a path its own scope refuses. Found in four more agents on this
      # check's first run.
      - name: No agent is ordered to use a tool it lacks or read a path it cannot
        run: node scripts/ci/check-agent-contract.mjs

      - name: Guardian coverage arithmetic and the empty-worklist floor
        run: node scripts/ci/check-guardian.mjs

      # Built BEFORE guardian, so guardian is written into a system that already
      # refuses to trust it. The case a "refuses on absent, stale or failing" spec
      # misses: a record that exists, is current, and says pass over an EMPTY
      # worklist. Refused by an explicit branch, and the verdict is an allow-list so
      # a sixth enum value refuses by default rather than falling through.
      - name: Release refuses on every guardian record that establishes nothing
        run: node scripts/ci/check-release-gate.mjs

      # The corpus's deterministic half. Whether guardian ANSWERS each case right
      # needs a model; that every expectation maps to a real enumerated site, and
      # that both controls exist - a degenerate-pass case with nothing to find, and
      # a case whose origin cannot be determined - does not.
      - name: Corpus has both controls and no expectation guardian will never be asked
        run: node scripts/ci/check-corpus.mjs

      # The corpus's OTHER deterministic half, and the one that was missing until
      # 0.1.17: the SCORING. Whether guardian answers correctly needs a model, but
      # comparing what it answered against what was expected does not - and until now
      # that comparison was done by a model reading two JSON files, which made the
      # acceptance test for guardian's judgement the one step in the corpus that
      # nothing checked. This asserts the scorer catches a broken record on each of
      # the three scored fields SEPARATELY, including one that fields 1 and 2 both
      # accept, and that its positive control still passes - without which a scorer
      # that failed everything would satisfy every negative in the file.
      - name: Corpus scorer catches a broken record on each scored field
        run: node scripts/ci/check-corpus-score.mjs

      # The corpus's THIRD deterministic half, and the one that made the other two
      # unusable until 0.1.19: the WRITER. `doctor` FAILs without a corpus result, and
      # there was no sanctioned way to produce one - no writer, no schema, a deny rule
      # and the risk guard both in the way. The 0.1.18 corpus passed all three cases
      # and could not be recorded. The danger in fixing that is a writer that ACCEPTS
      # a result, which would put the model back in the chair check-corpus-score.mjs
      # was written to take it out of, one layer further out where nothing looks. So
      # this asserts the result and the version are uncomputable by the caller, that a
      # partial or unscorable set is refused, and that the schema catches a record the
      # writer never produced. Its guard assertion is read through a channel first
      # proven capable of seeing a refusal - risk-guard exits 0 on every decision, so
      # a probe reading the exit code reports ALLOW for a guard denying everything.
      - name: Corpus writer computes the result it records
        run: node scripts/ci/check-corpus-writer.mjs

      # The same reasoning one field further in: the result names the LIBRARY it
      # graded, because the version alone cannot see a fixture edited inside a
      # version. Here for the escape-hatch reason the rest of the corpus family is
      # here - it hashes files and spawns doctor, and neither needs Claude Code.
      - name: The corpus result names the library it graded, and doctor reads it
        run: node scripts/ci/check-corpus-fingerprint.mjs

      # The corpus's isolation, which is the property the whole thing rests on and the
      # one that failed first. Through 0.1.17 the expectations sat inside the project,
      # filed as a known compromise - "out of the way, not out of reach" - and guardian
      # grepped an identifier and hit one, on a line carrying the answer. So this does
      # not assert the expectations are hard to find. It stages a case and asserts they
      # are NOT IN THE PROJECT AT ALL, then reconstructs the 0.1.17 layout and confirms
      # every assertion fails against it - including a prose-only variant that the
      # structural check accepts and the identifier check must not.
      - name: Corpus expectations are outside every project the scanner sees
        run: node scripts/ci/check-corpus-isolation.mjs

      # The OTHER half of the same property, and the half that moving the
      # expectations did not touch. The corpus staging root needs a fixture
      # exemption or the corpus cannot run - every case reads the service-role key
      # on purpose - and that exemption used to be DECLARED in .mavci/project.json,
      # which the shared agent contract ordered every agent to read first. Guardian
      # was instructed to open the file that named the corpus directory. Both sides
      # moved: the exemption is plugin-owned and undeclared, and guardian's startup
      # protocol overrides step 1. Asserted together because either alone reopens
      # the leak - and including the one assertion that catches an override which
      # explains itself, since the reason IS the disclosure.
      - name: A corpus run is invisible in the manifest, and guardian is not sent there
        run: node scripts/ci/check-corpus-blind.mjs

      # The third leak, and the only one that removes a CAPABILITY rather than an
      # instruction: guardian's Read/Grep/Glob are now scoped by risk-guard.mjs.
      # Narrowing a read grant is the change most likely to break the thing the grant
      # exists for - a scope that stops a trace makes guardian answer `unknown`, which
      # is a legitimate value, so the run completes and records a verdict and the
      # failure is silent. So this asserts FIRST that every corpus case is still
      # traceable, then demonstrates the obvious scope - the worklist paths - failing:
      # it breaks q3v7k, the degenerate-pass control, and lets t5w9d pass for the wrong
      # reason. Every negative is asserted on the REFUSAL REASON, not the decision.
      - name: Guardian's reads are scoped without breaking the trace, and refuse with a reason
        run: node scripts/ci/check-read-scope.mjs

      # scribe.json promises this check by name, which under this repo's own rule is
      # a debt until it exists. Two things beyond existence: a citation that resolves
      # to the WRONG thing fails (a task id carrying another task's title, a verdict
      # for a different run, a sha on another branch), and a document that cites
      # NOTHING fails - it passes referential integrity trivially and is the
      # fabricated-prose case the haiku tier accepts as its exposure.
      - name: Scribe citations resolve, and a document that cites nothing fails
        run: node scripts/ci/check-scribe-refs.mjs --selftest

      # Same defect as check-command-refs, different namespace. A /mavci-core:<name>
      # that does not resolve was covered since 0.1.12; a check-*.mjs named in a
      # comment as the thing that guarantees a property was not - and one had dangled
      # in rules/index.mjs since 0.1.12, taking an audit and a git log to resolve.
      - name: Every .mjs named in shipped code exists
        run: node scripts/ci/check-script-refs.mjs

      - name: Agent definitions are plain markdown usable without the plugin
        run: |
          for f in plugins/mavci-core/agents/*.md; do
            head -1 "$f" | grep -q -- '---' || { echo "::error::$f has no YAML frontmatter"; exit 1; }
            grep -q '^name:' "$f" || { echo "::error::$f has no name field"; exit 1; }
          done
          echo "agent definitions are portable: cp -r agents .claude/agents works"

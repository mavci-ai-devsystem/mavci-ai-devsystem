# Release gate.
#
# Every project's CI clones the system at tag `v<state.json.plugin_version>`
# (blocker B4). That only works if the tag and the manifest version agree, so
# this job refuses a tag that does not match plugin.json.
#
# A mismatch here would mean projects silently pin to a tag that does not exist,
# and their CI would fail with a confusing checkout error rather than a clear one.

name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  tag-matches-manifest:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 because check-tags.mjs runs `git describe` against the
      # mainline and peels every tag. The default single-ref shallow checkout
      # fetches neither, and the check fails closed rather than pass blind.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'

      - name: Tag must equal plugin.json version
        run: |
          manifest=$(node -p "require('./plugins/mavci-core/.claude-plugin/plugin.json').version")
          tag="${GITHUB_REF_NAME#v}"
          echo "plugin.json: $manifest"
          echo "git tag:     $tag"
          if [ "$manifest" != "$tag" ]; then
            echo "::error::tag v$tag does not match plugin.json version $manifest."
            echo "::error::Projects pin CI to the tag, so a mismatch breaks their builds. Fix one and re-tag."
            exit 1
          fi

      # "Tag equals plugin.json version" passes happily while the tag trails
      # main - the manifest and the tag can agree on a tree that is not the
      # tree that was tested. This step is the one that compares trees, and it
      # peels annotated tags rather than comparing a tag object to a commit.
      - name: Tag is the mainline, and every tag is annotated
        run: node scripts/ci/check-tags.mjs

      - name: Full validation must pass before a release exists
        run: |
          node plugins/mavci-core/scripts/build-agents.mjs --check
          node plugins/mavci-core/scripts/redact.mjs --selftest
          node scripts/ci/check-schemas.mjs
          node scripts/ci/check-fixtures.mjs
          node scripts/ci/check-risk-guard.mjs
          node scripts/ci/check-gate.mjs
          node scripts/ci/check-plugin.mjs
          node scripts/ci/check-doctor.mjs
          node scripts/ci/check-escape-hatch.mjs
          node scripts/ci/check-placeholders.mjs
          node scripts/ci/check-skill-placeholders.mjs
          node scripts/ci/check-hooks-quiet.mjs
          node scripts/ci/check-packaging.mjs
          node scripts/ci/check-command-invocation.mjs

      # The release gate that would have stopped v0.1.2. A hooks.json Claude Code
      # rejects installs cleanly and registers ZERO hooks, so a tag must never
      # exist without its own validator having passed on the exact tagged tree.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Claude Code validates the tagged plugin and marketplace
        run: |
          claude plugin validate ./plugins/mavci-core --strict
          claude plugin validate . --strict
